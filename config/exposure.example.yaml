# Beispiel für config/exposure.yaml – kopieren nach config/exposure.yaml und je Bestands-/Watchlist-Ticker pflegen.
# Die echte exposure.yaml steht in .gitignore. Namen in customers/suppliers/competitors werden im Text gesucht -> Zweitwirkung.

AAPL:
