# Beispiel für config/universe.yaml – kopieren nach config/universe.yaml und mit eigenen Werten füllen.
# Die echte universe.yaml (Bestand, Watchlist) steht in .gitignore und ist nicht im Repo.
# quote_symbol: Symbol für Finnhub /quote (Free-Tier liefert nur US-Kurse).

holdings:        # eigener Bestand: erzeugt die schärfsten Signale
  AAPL: {name: Apple, aliases: [Apple, Apple Inc], isin: US0378331005}

etf_core: []     # nur Info – ETFs erzeugen keine Einzelsignale

watchlist:
  MSFT: {name: Microsoft, aliases: [Microsoft], isin: US5949181045}

# Firmen im Themenuniversum, auf keiner Liste -> Kategorie CANDIDATE (strengere Schwelle, max. 5/Tag).
